name: docs-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify all commits carry Signed-off-by (DCO)
        run: |
          set -e
          BASE="${GITHUB_EVENT_PULL_REQUEST_BASE_SHA:-${{ github.event.pull_request.base.sha }}}"
          HEAD="${GITHUB_EVENT_PULL_REQUEST_HEAD_SHA:-${{ github.event.pull_request.head.sha }}}"
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "Skipping DCO check outside pull_request context"
            exit 0
          fi
          bad=""
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q "^Signed-off-by: "; then
              echo "::error::commit $c is missing Signed-off-by trailer (DCO)"
              bad=1
            fi
          done
          if [ -n "$bad" ]; then
            echo "All commits must include a Signed-off-by trailer. Use: git commit -s"
            exit 1
          fi
          echo "DCO check passed"

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository files
        run: |
          set -e
          python3 - <<'PY'
          import json, pathlib, sys
          try:
              import yaml
              HAVE_YAML = True
          except ImportError:
              HAVE_YAML = False
          from html.parser import HTMLParser

          class HtmlCheck(HTMLParser):
              pass

          ok = True
          for f in pathlib.Path(".").rglob("*"):
              if f.is_dir() or ".git" in f.parts:
                  continue
              suf = f.suffix.lower()
              try:
                  if suf == ".json":
                      json.loads(f.read_text(errors="ignore"))
                  elif suf == ".html":
                      HtmlCheck().feed(f.read_text(errors="ignore"))
                  elif suf in (".yaml", ".yml") and HAVE_YAML:
                      list(yaml.safe_load_all(f.read_text(errors="ignore")))
                  elif suf == ".md":
                      text = f.read_text(errors="ignore")
                      if text.count("```") % 2 != 0:
                          print(f"{f}: unbalanced code fences")
                          ok = False
              except Exception as e:
                  print(f"{f}: {e}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY
